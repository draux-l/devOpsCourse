<script>
(function () {
    var KEY = 'skool-progress:v1';
    var API = '/api/progress';
    var P = {
        data: {},
        backend: 'local',
        load: function (cb) {
            var local = {};
            try { local = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { local = {}; }
            P.data = local;
            var done = function () { if (cb) { try { cb(); } catch (e) {} } };
            if (location.protocol === 'file:') { P.backend = 'local'; done(); return; }
            fetch(API, { cache: 'no-store' }).then(function (r) {
                if (!r.ok) throw new Error('http ' + r.status);
                return r.json();
            }).then(function (server) {
                P.backend = 'server';
                var merged = {}, k;
                for (k in server) if (Object.prototype.hasOwnProperty.call(server, k)) merged[k] = 1;
                for (k in local) if (Object.prototype.hasOwnProperty.call(local, k) && !merged[k]) merged[k] = 1;
                P.data = merged;
                P.persistLocal();
                done();
            }).catch(function () { P.backend = 'local'; done(); });
        },
        persistLocal: function () { try { localStorage.setItem(KEY, JSON.stringify(P.data)); } catch (e) {} },
        isDone: function (id) { return !!P.data[id]; },
        set: function (id, isDone) {
            if (isDone) { P.data[id] = 1; } else { delete P.data[id]; }
            P.persistLocal();
            P.push();
        },
        toggle: function (id) { P.set(id, !P.data[id]); },
        reset: function () { P.data = {}; P.persistLocal(); P.push(); },
        push: function () {
            if (P.backend !== 'server') return;
            clearTimeout(P._t);
            P._t = setTimeout(function () {
                try {
                    fetch(API, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(P.data)
                    });
                } catch (e) {}
            }, 200);
        }
    };
    window.Progress = P;
})();
</script>
<script>
(function () {

        var done = Progress.isDone(id);
        btn.textContent = done ? '✓ Completada' : 'Marcar completada';

    }

})();
